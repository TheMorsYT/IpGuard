kick-unauthorized-ip: |-
  &c&lACCESS DENIED
  
  &7Account &e%player% &7is protected by IP verification.
  &7Your IP address (&c%ip%&7) is not authorized!
kick-unauthorized-op: |-
  &c&lSECURITY ALERT — UNAUTHORIZED OP
  
  &7Account &e%player% &7has operator (OP) privileges,
  &7but your IP address (&c%ip%&7) is not whitelisted in IpGuard!
